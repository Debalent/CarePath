name: Deploy Frontend to S3

"on":
  push:
    branches: [main]
    paths:
      - "carepath-ui/**"
      - ".github/workflows/deploy-s3-ui.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: carepath-ui/package-lock.json

      - name: Install dependencies
        working-directory: carepath-ui
        run: npm ci

      - name: Build static export
        working-directory: carepath-ui
        env:
          NEXT_PUBLIC_CAREPATH_API_URL: ${{ secrets.NEXT_PUBLIC_CAREPATH_API_URL || '' }}
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Sync to S3
        run: |
          aws s3 sync carepath-ui/out/ s3://${{ secrets.S3_FRONTEND_BUCKET }}/ \
            --delete \
            --cache-control "public, max-age=3600"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

